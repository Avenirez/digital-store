# ─── Tahap 1: HTTP only (untuk Certbot challenge) ─────
# Setelah SSL berhasil, ganti dengan default.ssl.conf

server {
    listen 80;
    server_name lexaastore.cloud www.lexaastore.cloud;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API proxy — langsung ke backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout tinggi untuk webhook listener
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Frontend — semua path lain ke container frontend (Nginx internal)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
